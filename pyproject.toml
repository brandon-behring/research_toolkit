[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research_toolkit"
version = "3.0.0a2"
description = "Portable research contracts, deterministic dossier tooling, and a Claude Code workflow plugin."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Installing either runtime PDF extra is an explicit opt-in to parsing
# untrusted PDF bytes in-process. The dev extra includes pdfplumber solely so
# the opt-in parser's regression tests run in a clean development install;
# production capture remains raw-only unless the operator passes the explicit
# extraction flag.
pdf = [
  "pdfplumber>=0.11",
]
rich-pdf = [
  "pdfplumber>=0.11",
  # docling 2.30+ requires docling-parse 5.x which currently ships source-only
  # on PyPI (no wheels for darwin x86_64 py3.12); the source build fails with
  # cstdint not found. docling 2.29.x works with docling-parse 4.7.2 which has
  # binary wheels. Re-evaluate when docling-parse 5.x ships wheels.
  "docling>=2.0,<2.30",
]
dev = [
  "pytest>=8.0",
  "pdfplumber>=0.11",
  "reportlab>=4.0",
  "pypdf>=4.0",
]
synthesis = [
  # Required for /dataset-synthesize (closes #1). Lazy-imported by
  # scripts/dataset_synthesize.py so --validate-only works without this.
  "anthropic>=0.40",
]

[project.scripts]
# Unified pipeline entry point (v2.6). Subcommands dispatch to the existing
# scripts/*.main() and validators/freshness:_cli (see scripts/cli.py).
research-toolkit = "scripts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["validators*", "scripts*", "research_toolkit*"]

[tool.setuptools.package-data]
research_toolkit = ["../schemas/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
